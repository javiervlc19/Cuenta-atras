<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuenta atrás</title>
  <style>
    :root {
      color-scheme: light;
      --bg-start: #eef6ff;
      --bg-mid: #dce9ff;
      --bg-end: #ffd8bf;
      --card: rgba(255, 255, 255, 0.72);
      --text: #1f2a44;
      --muted: #61708f;
      --accent: #ff7a45;
      --accent-soft: rgba(255, 122, 69, 0.14);
      --line-soft: rgba(97, 112, 143, 0.18);
      --shadow: 0 28px 90px rgba(69, 93, 140, 0.16);
      --radius: 28px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 15%, rgba(255, 255, 255, 0.92), transparent 24%),
        radial-gradient(circle at 80% 20%, rgba(186, 220, 255, 0.7), transparent 28%),
        radial-gradient(circle at 50% 85%, rgba(255, 194, 152, 0.5), transparent 22%),
        linear-gradient(180deg, var(--bg-start) 0%, var(--bg-mid) 52%, var(--bg-end) 100%);
      display: grid;
      place-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .blob {
      position: fixed;
      inset: auto;
      width: 42vw;
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(34px);
      opacity: 0.5;
      pointer-events: none;
      animation: float 16s ease-in-out infinite;
    }

    .blob.one {
      top: 2%;
      left: -8%;
      background: rgba(255, 255, 255, 0.95);
    }

    .blob.two {
      right: -10%;
      bottom: 12%;
      background: rgba(255, 182, 130, 0.45);
      animation-delay: -6s;
    }

    .blob.three {
      top: 34%;
      right: 8%;
      width: 26vw;
      background: rgba(201, 227, 255, 0.7);
      animation-delay: -2s;
    }

    .app {
      width: min(100%, 440px);
      background: var(--card);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px 22px;
    }

    .journey {
      position: relative;
      margin-bottom: 24px;
      padding: 18px 14px 22px;
      background:
        linear-gradient(180deg, rgba(240, 246, 255, 0.96), rgba(255, 245, 237, 0.88));
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 24px;
      overflow: hidden;
    }

    .journey-top {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 12px;
      margin-bottom: 18px;
    }

    .place {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 124px;
      padding: 14px 12px 12px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.56);
      border: 1px solid rgba(255, 255, 255, 0.62);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
      text-align: center;
    }

    .place-time {
      width: 100%;
      padding: 10px 8px;
      border-radius: 14px;
      background: linear-gradient(180deg, #22314a, #162134);
      color: #f7fbff;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      font-variant-numeric: tabular-nums;
      box-shadow:
        0 12px 24px rgba(33, 49, 74, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .flag {
      width: 72px;
      height: 52px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 24px rgba(42, 31, 26, 0.12);
      border: 1px solid rgba(42, 31, 26, 0.08);
      background: #fff;
      display: grid;
      place-items: center;
    }

    .place-name {
      font-size: 0.78rem;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .board-chip {
      display: block;
      width: fit-content;
      margin: 0 auto 12px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(27, 42, 68, 0.08);
      color: #32476d;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .route {
      position: relative;
      margin: 0 18px;
      height: 68px;
    }

    .route-line,
    .route-progress {
      position: absolute;
      left: 0;
      top: 50%;
      height: 8px;
      border-radius: 999px;
      transform: translateY(-50%);
    }

    .route-line {
      width: 100%;
      background:
        repeating-linear-gradient(
          90deg,
          var(--line-soft) 0 12px,
          transparent 12px 20px
        );
      opacity: 0.9;
    }

    .route-progress {
      width: 0;
      background: linear-gradient(90deg, #7fc2ff, var(--accent));
      box-shadow: 0 0 20px rgba(255, 122, 69, 0.24);
    }

    .plane {
      position: absolute;
      top: 50%;
      left: 0;
      transform: translate(-50%, -50%);
      font-size: 1.8rem;
      line-height: 1;
      filter: drop-shadow(0 8px 14px rgba(42, 31, 26, 0.18));
    }

    .journey-meta {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .journey-stat {
      padding: 10px 6px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.58);
      text-align: center;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    .journey-stat .value {
      display: block;
      font-size: 1.25rem;
      line-height: 1;
      letter-spacing: -0.06em;
    }

    .journey-stat .label {
      margin-top: 4px;
      font-size: 0.62rem;
      letter-spacing: 0.08em;
    }

    .song-card {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 14px;
      align-items: center;
      margin-bottom: 24px;
      padding: 14px;
      background: rgba(255, 255, 255, 0.68);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.55);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    .song-cover {
      width: 92px;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 20px;
      display: block;
      box-shadow: 0 14px 28px rgba(42, 31, 26, 0.14);
    }

    .song-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      color: #1d9b5d;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .song-title {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 800;
      line-height: 1.25;
    }

    .song-meta {
      display: none;
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .song-link {
      display: inline-block;
      margin-top: 10px;
      color: var(--accent);
      font-size: 0.88rem;
      font-weight: 700;
      text-decoration: none;
    }

    .song-link:hover {
      text-decoration: underline;
    }

    .phrase-wrap {
      margin-bottom: 24px;
    }

    .phrase-button {
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 16px 18px;
      background: linear-gradient(135deg, #ff8456, #ffb36d);
      color: #ffffff;
      font-size: 0.96rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      box-shadow: 0 14px 28px rgba(255, 122, 69, 0.22);
      cursor: pointer;
    }

    .phrase-box {
      display: none;
      margin-top: 12px;
      padding: 18px 16px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.55);
      color: var(--text);
      text-align: center;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    .phrase-box.is-visible {
      display: block;
    }

    .phrase-form {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .phrase-input {
      width: 100%;
      border: 1px solid rgba(97, 112, 143, 0.18);
      border-radius: 16px;
      padding: 14px;
      background: rgba(255, 255, 255, 0.84);
      color: var(--text);
      font: inherit;
    }

    .phrase-save {
      border: 0;
      border-radius: 16px;
      padding: 14px 16px;
      background: linear-gradient(135deg, #ff8456, #ffb36d);
      color: #ffffff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 12px 24px rgba(255, 122, 69, 0.22);
    }

    .phrase-status {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 0.84rem;
      min-height: 1.2em;
      text-align: left;
    }

    .phrase-saved {
      display: grid;
      gap: 10px;
      margin-top: 12px;
      text-align: left;
    }

    .phrase-saved-item {
      padding: 14px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .phrase-item-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .phrase-saved-name {
      margin: 0 0 6px;
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .phrase-saved-text {
      margin: 0;
      font-size: 0.94rem;
      line-height: 1.45;
      font-weight: 700;
    }

    .phrase-label {
      display: block;
      margin-bottom: 8px;
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .phrase-text {
      margin: 0;
      font-size: 1rem;
      line-height: 1.5;
      font-weight: 700;
    }

    .planner {
      margin-bottom: 24px;
      padding: 0;
      border-radius: 24px;
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    .planner-toggle {
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 18px;
      padding: 16px 18px;
      background: linear-gradient(135deg, #77bfff, #5f93ff);
      color: #ffffff;
      font: inherit;
      font-size: 0.96rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      box-shadow: 0 14px 28px rgba(95, 147, 255, 0.22);
      cursor: pointer;
    }

    .planner-toggle::after {
      content: "+";
      position: absolute;
      right: 18px;
      color: currentColor;
      font-size: 1.2rem;
      line-height: 1;
    }

    .planner.is-open .planner-toggle::after {
      content: "−";
    }

    .planner-content {
      display: none;
      margin-top: 14px;
      padding: 16px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.68);
      border: 1px solid rgba(255, 255, 255, 0.55);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    .planner.is-open .planner-content {
      display: block;
    }

    .planner-subtitle {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .planner-form {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
    }

    .planner-actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    .planner-input {
      width: 100%;
      border: 1px solid rgba(97, 112, 143, 0.18);
      border-radius: 16px;
      padding: 14px;
      background: rgba(255, 255, 255, 0.84);
      color: var(--text);
      font: inherit;
    }

    .planner-input::placeholder {
      color: #92a0b9;
    }

    .planner-save {
      border: 0;
      border-radius: 16px;
      padding: 14px 16px;
      background: linear-gradient(135deg, #77bfff, #5f93ff);
      color: #ffffff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 12px 24px rgba(95, 147, 255, 0.22);
    }

    .planner-status {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 0.84rem;
      min-height: 1.2em;
    }

    .planner-list {
      display: grid;
      gap: 10px;
    }

    .planner-item {
      padding: 14px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .planner-date {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .planner-line {
      margin: 0;
      font-size: 0.92rem;
      line-height: 1.45;
    }

    .planner-item-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .planner-mini {
      border: 0;
      border-radius: 12px;
      padding: 9px 12px;
      font: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .planner-mini.edit {
      background: rgba(95, 147, 255, 0.14);
      color: #3f6fe0;
    }

    .planner-mini.delete {
      background: rgba(255, 122, 69, 0.14);
      color: #d45a2d;
    }

    .planner-empty {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .photo-diary {
      margin-bottom: 24px;
      padding: 0;
      border-radius: 24px;
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    .photo-diary.is-open .photo-content {
      display: block;
    }

    .photo-toggle {
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 18px;
      padding: 16px 18px;
      background: linear-gradient(135deg, #243b63, #3c5f98);
      color: #ffffff;
      font: inherit;
      font-size: 0.96rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      box-shadow: 0 14px 28px rgba(36, 59, 99, 0.22);
      cursor: pointer;
    }

    .photo-toggle::after {
      content: "+";
      position: absolute;
      right: 18px;
      color: currentColor;
      font-size: 1.2rem;
      line-height: 1;
    }

    .photo-diary.is-open .photo-toggle::after {
      content: "-";
    }

    .photo-content {
      display: none;
      margin-top: 14px;
      padding: 16px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.68);
      border: 1px solid rgba(255, 255, 255, 0.55);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    .photo-title {
      margin: 0 0 6px;
      font-size: 1rem;
      font-weight: 800;
    }

    .photo-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .photo-button {
      width: 52px;
      height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 16px;
      padding: 0;
      background: linear-gradient(135deg, #243b63, #3c5f98);
      color: #ffffff;
      box-shadow: 0 14px 28px rgba(36, 59, 99, 0.22);
      cursor: pointer;
      flex: 0 0 auto;
    }

    .photo-button svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .photo-mini-action {
      border: 0;
      border-radius: 14px;
      padding: 11px 14px;
      font: inherit;
      font-size: 0.84rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .photo-mini-action:active {
      transform: scale(0.98);
    }

    .photo-mini-action.edit {
      background: rgba(60, 95, 152, 0.12);
      color: #2f4f83;
    }

    .photo-mini-action.delete {
      background: rgba(255, 122, 69, 0.14);
      color: #d45a2d;
    }

    .photo-mini-action.cancel {
      background: rgba(36, 59, 99, 0.08);
      color: #4d6288;
    }

    .photo-input {
      display: none;
    }

    .photo-status {
      margin: 0;
      color: var(--muted);
      font-size: 0.84rem;
      min-height: 1.2em;
      flex: 1;
    }

    .photo-preview-wrap {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .photo-preview-wrap.is-visible {
      display: block;
    }

    .photo-meta {
      margin: 0 0 10px;
      color: #243b63;
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 800;
    }

    .photo-strip-title {
      display: none;
      margin: 14px 0 8px;
      color: #243b63;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .photo-strip-title.is-visible {
      display: block;
    }

    .photo-list {
      display: grid;
      gap: 10px;
      margin-top: 0;
    }

    .photo-item {
      padding: 12px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .photo-item-date {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .photo-thumb {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 16px;
      display: block;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .photo-card {
      position: relative;
      border: 0;
      padding: 0;
      margin: 0;
      background: transparent;
      cursor: pointer;
      border-radius: 16px;
      overflow: hidden;
    }

    .photo-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(24, 39, 68, 0);
      transition: background 0.2s ease;
      pointer-events: none;
    }

    .photo-diary.is-editing .photo-card::after {
      background: rgba(24, 39, 68, 0.1);
    }

    .photo-card.is-selected::after {
      background: rgba(47, 111, 224, 0.3);
    }

    .photo-card.is-selected .photo-thumb {
      outline: 3px solid #4f86ff;
      outline-offset: -3px;
    }

    .photo-check {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      border: 2px solid rgba(36, 59, 99, 0.2);
      box-shadow: 0 8px 14px rgba(36, 59, 99, 0.16);
      opacity: 0;
      transform: scale(0.88);
      transition: opacity 0.2s ease, transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      pointer-events: none;
    }

    .photo-diary.is-editing .photo-check {
      opacity: 1;
      transform: scale(1);
    }

    .photo-card.is-selected .photo-check {
      background: #4f86ff;
      border-color: #4f86ff;
    }

    .photo-card.is-selected .photo-check::after {
      content: "";
      position: absolute;
      left: 6px;
      top: 2px;
      width: 6px;
      height: 12px;
      border: solid #ffffff;
      border-width: 0 3px 3px 0;
      transform: rotate(45deg);
    }

    .value {
      display: block;
      font-weight: 800;
    }

    .label {
      display: block;
      color: var(--muted);
      text-transform: uppercase;
    }

    .done {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 18px;
      background: #fff0df;
      color: #9a4528;
      font-weight: 700;
      text-align: center;
      display: none;
    }

    @keyframes float {
      0%, 100% {
        transform: translate3d(0, 0, 0) scale(1);
      }
      50% {
        transform: translate3d(0, -18px, 0) scale(1.05);
      }
    }

    @media (max-width: 380px) {
      .app {
        padding: 22px 16px;
      }

      .journey-meta {
        gap: 6px;
      }

      .journey-stat {
        padding: 9px 4px;
      }

      .journey-stat .value {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <div class="blob one"></div>
  <div class="blob two"></div>
  <div class="blob three"></div>

  <main class="app">
    <section class="journey" aria-label="Trayecto del viaje">
      <div class="journey-top">
        <div class="place">
          <div class="place-time" id="time-korea">00:00</div>
          <div class="flag" aria-hidden="true">
            <svg viewBox="0 0 58 42" width="58" height="42">
              <rect width="58" height="42" fill="#ffffff"/>
              <g transform="translate(29 21)">
                <path d="M0-8a8 8 0 0 1 0 16a4 4 0 0 1 0-8a4 4 0 0 0 0-8z" fill="#cd2e3a"/>
                <path d="M0 8a8 8 0 0 1 0-16a4 4 0 0 0 0 8a4 4 0 0 1 0 8z" fill="#0047a0"/>
              </g>
              <g fill="#111111">

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function getDayIndex(now) {
      const elapsedDays = Math.max(0, Math.floor((now - startDate) / 86400000));
      return Math.min(elapsedDays, dailyPhrases.length - 1);

      return tripDays[getDayIndex(now)];

      elements.photoEditToggle.textContent = photoEditMode ? "Seleccionando" : "Editar";

    function renderPhotos(now) {
      const day = getDayData(now);
      const currentItems = state.photosByDay[day.key] || [];
      syncPhotoEditingUi();
      if (currentItems.length > 0) {
        elements.photoPreviewWrap.classList.add("is-visible");
        elements.photoMeta.textContent = `Fotos del ${day.label}`;

        elements.photoPreviewWrap.classList.remove("is-visible");
        elements.photoTodayGrid.innerHTML = "";

      elements.photoStripTitle.classList.toggle("is-visible", historyDays.length > 0);

      const currentEntries = state.plansByDay[currentDay.key] || [];

    function updateCountdown() {
      const now = new Date();
      const diff = targetDate - now;
      const totalTrip = targetDate - startDate;
      const elapsed = now - startDate;
      const progress = Math.min(Math.max(elapsed / totalTrip, 0), 1);
      const progressPercent = Math.round(progress * 100);
      elements.routeProgress.style.width = `${progressPercent}%`;
      elements.plane.style.left = `${progressPercent}%`;
      elements.timeKorea.textContent = formatTimeInZone(now, "Asia/Seoul");
      elements.timeSpain.textContent = formatTimeInZone(now, "Europe/Madrid");
      updateDailySong(now);
      updateDailyPhrase(now);
      renderPlanner(now);
      renderPhotos(now);

      if (diff <= 0) {
        elements.days.textContent = "00";
        elements.hours.textContent = "00";
        elements.minutes.textContent = "00";
        elements.seconds.textContent = "00";
        elements.done.style.display = "block";
        elements.routeProgress.style.width = "100%";
        elements.plane.style.left = "100%";
        return;
      }

      const totalSeconds = Math.floor(diff / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      elements.days.textContent = pad(days);
      elements.hours.textContent = pad(hours);
      elements.minutes.textContent = pad(minutes);
      elements.seconds.textContent = pad(seconds);
    }

    async function loadCloudData() {
      const [plansResult, phrasesResult, photosResult] = await Promise.all([
        supabase.from("trip_plans").select("id, day_key, plan, food, created_at").order("created_at", { ascending: true }),
        supabase.from("trip_phrases").select("day_key, nuria, javi"),
        supabase.from("trip_photos").select("id, day_key, photo_path, created_at").order("created_at", { ascending: false })
      ]);
      if (plansResult.error) throw plansResult.error;
      if (phrasesResult.error) throw phrasesResult.error;
      if (photosResult.error) throw photosResult.error;

      state.plansByDay = {};
      for (const item of plansResult.data) {
        state.plansByDay[item.day_key] = state.plansByDay[item.day_key] || [];
        state.plansByDay[item.day_key].push(item);
      }

      state.phrasesByDay = {};
      for (const item of phrasesResult.data) {
        state.phrasesByDay[item.day_key] = item;
      }

      state.photosByDay = {};
      for (const item of photosResult.data) {
        const { data } = supabase.storage.from(photoBucket).getPublicUrl(item.photo_path);
        state.photosByDay[item.day_key] = state.photosByDay[item.day_key] || [];
        state.photosByDay[item.day_key].push({ id: item.id, photo_path: item.photo_path, publicUrl: data.publicUrl });
      }
    }

    elements.phraseButton.addEventListener("click", () => {
      elements.phraseBox.classList.toggle("is-visible");
    });

    elements.phraseSaved.addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-action='edit-phrase'], button[data-action='delete-phrase']");
      if (!button) return;

      const day = getDayData(new Date());
      const person = button.dataset.person;
      const current = state.phrasesByDay[day.key] || { nuria: "", javi: "" };

      if (button.dataset.action === "edit-phrase") {
        if (person === "nuria") elements.phrasePersonOne.focus();
        if (person === "javi") elements.phrasePersonTwo.focus();
        elements.phraseStatus.textContent = "Edita la frase y vuelve a guardarla.";
        return;
      }

      if (person === "nuria") {
        current.nuria = "";
        elements.phrasePersonOne.value = "";
      }
      if (person === "javi") {
        current.javi = "";
        elements.phrasePersonTwo.value = "";
      }

      const payload = {
        day_key: day.key,
        nuria: current.nuria || "",
        javi: current.javi || "",
        updated_at: new Date().toISOString()
      };

      const { error } = await supabase.from("trip_phrases").upsert(payload);
      if (error) {
        elements.phraseStatus.textContent = "No se pudo borrar la frase.";
        return;
      }

      state.phrasesByDay[day.key] = payload;
      renderSavedPhrases(new Date());
      elements.phraseStatus.textContent = "Frase borrada.";
    });

    elements.phraseForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const day = getDayData(new Date());
      const nuria = elements.phrasePersonOne.value.trim();
      const javi = elements.phrasePersonTwo.value.trim();
      if (!nuria && !javi) {
        elements.phraseStatus.textContent = "Escribe al menos una frase.";
        return;
      }

      elements.phraseStatus.textContent = "Guardando...";
      const { error } = await supabase.from("trip_phrases").upsert({ day_key: day.key, nuria, javi, updated_at: new Date().toISOString() });
      if (error) {
        elements.phraseStatus.textContent = "No se pudieron guardar las frases.";
        return;
      }

      state.phrasesByDay[day.key] = { day_key: day.key, nuria, javi };
      elements.phraseStatus.textContent = `Frases guardadas para el ${day.label}.`;
      renderSavedPhrases(new Date());
    });

    elements.plannerToggle.addEventListener("click", () => {
      elements.plannerSection.classList.toggle("is-open");
    });

    elements.photoToggle.addEventListener("click", () => {
      elements.photoSection.classList.toggle("is-open");
    });

    elements.plannerCancel.addEventListener("click", () => {
      clearPlannerForm();
      elements.plannerStatus.textContent = "";
    });

    elements.plannerList.addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const action = button.dataset.action;
      const dayKey = button.dataset.day;
      const itemId = button.dataset.id;
      const item = (state.plansByDay[dayKey] || []).find((entry) => entry.id === itemId);

      if (action === "edit" && item) {
        plannerEditingId = item.id;
        plannerEditingDayKey = dayKey;
        elements.planInput.value = item.plan || "";
        elements.foodInput.value = item.food || "";
        elements.plannerSave.textContent = "Guardar cambios";
        elements.plannerCancel.hidden = false;
        elements.plannerSection.classList.add("is-open");
        elements.planInput.focus();
        elements.plannerStatus.textContent = "Editando entrada.";
      }

      if (action === "delete") {
        const { error } = await supabase.from("trip_plans").delete().eq("id", itemId);
        if (error) {
          elements.plannerStatus.textContent = "No se pudo borrar la entrada.";
          return;
        }
        state.plansByDay[dayKey] = (state.plansByDay[dayKey] || []).filter((entry) => entry.id !== itemId);
        if (state.plansByDay[dayKey].length === 0) delete state.plansByDay[dayKey];
        if (plannerEditingId === itemId) clearPlannerForm();
        elements.plannerStatus.textContent = "Entrada borrada.";
        renderPlanner(new Date());
      }
    });

    elements.plannerForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const currentDay = getDayData(new Date());
      const targetDayKey = plannerEditingDayKey || currentDay.key;
      const targetDay = tripDays.find((day) => day.key === targetDayKey) || currentDay;
      const plan = elements.planInput.value.trim();
      const food = elements.foodInput.value.trim();
      if (!plan && !food) {
        elements.plannerStatus.textContent = "Escribe al menos un plan o una comida.";
        return;
      }

      elements.plannerStatus.textContent = "Guardando...";
      if (plannerEditingId) {
        const { data, error } = await supabase.from("trip_plans").update({ plan, food }).eq("id", plannerEditingId).select("id, day_key, plan, food, created_at").single();
        if (error) {
          elements.plannerStatus.textContent = "No se pudieron guardar los cambios.";
          return;
        }
        state.plansByDay[targetDayKey] = (state.plansByDay[targetDayKey] || []).map((entry) => entry.id === plannerEditingId ? data : entry);
        elements.plannerStatus.textContent = `Actualizado para el ${targetDay.label}.`;
      } else {
        const { data, error } = await supabase.from("trip_plans").insert({ day_key: targetDayKey, plan, food }).select("id, day_key, plan, food, created_at").single();
        if (error) {
          elements.plannerStatus.textContent = "No se pudo guardar la entrada.";
          return;
        }
        state.plansByDay[targetDayKey] = state.plansByDay[targetDayKey] || [];
        state.plansByDay[targetDayKey].push(data);
        elements.plannerStatus.textContent = `Guardado para el ${targetDay.label}.`;
      }

      clearPlannerForm();
      renderPlanner(new Date());
    });

    elements.photoInput.addEventListener("change", async (event) => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const day = getDayData(new Date());
      const extension = (file.name.split(".").pop() || "jpg").toLowerCase();
      const filePath = `${day.key}-${Date.now()}.${extension}`;
      elements.photoStatus.textContent = "Subiendo foto...";

      const { error: uploadError } = await supabase.storage.from(photoBucket).upload(filePath, file, { upsert: false });
      if (uploadError) {
        elements.photoStatus.textContent = "No se pudo subir la foto.";
        elements.photoInput.value = "";
        return;
      }

      const { data: rowData, error: rowError } = await supabase.from("trip_photos").insert({ day_key: day.key, photo_path: filePath }).select("id, day_key, photo_path, created_at").single();
      if (rowError) {
        elements.photoStatus.textContent = "La foto se subio pero no se pudo registrar.";
        elements.photoInput.value = "";
        return;
      }

      const { data } = supabase.storage.from(photoBucket).getPublicUrl(filePath);
      state.photosByDay[day.key] = state.photosByDay[day.key] || [];
      state.photosByDay[day.key].unshift({ id: rowData.id, photo_path: filePath, publicUrl: data.publicUrl });
      elements.photoStatus.textContent = `Foto guardada para el ${day.label}.`;
      elements.photoInput.value = "";
      renderPhotos(new Date());
    });

    elements.photoEditToggle.addEventListener("click", () => {
      photoEditMode = true;
      elements.photoSection.classList.add("is-open");
      elements.photoStatus.textContent = selectedPhotoIds.size > 0 ? `${selectedPhotoIds.size} fotos seleccionadas.` : "Selecciona las fotos que quieras borrar.";
      renderPhotos(new Date());
    });

    elements.photoCancelEdit.addEventListener("click", () => {
      photoEditMode = false;
      selectedPhotoIds.clear();
      elements.photoStatus.textContent = "";
      renderPhotos(new Date());
    });

    elements.photoDeleteSelected.addEventListener("click", async () => {
      if (selectedPhotoIds.size === 0) {
        elements.photoStatus.textContent = "Selecciona al menos una foto.";
        return;
      }

      const selectedItems = Object.entries(state.photosByDay).flatMap(([dayKey, items]) =>
        items
          .filter((item) => selectedPhotoIds.has(item.id))
          .map((item) => ({ dayKey, ...item }))
      );

      if (selectedItems.length === 0) {
        selectedPhotoIds.clear();
        elements.photoStatus.textContent = "No se encontraron las fotos seleccionadas.";
        renderPhotos(new Date());
        return;
      }

      elements.photoStatus.textContent = "Borrando fotos...";
      const selectedIds = selectedItems.map((item) => item.id);
      const photoPaths = selectedItems.map((item) => item.photo_path).filter(Boolean);

      const { error } = await supabase.from("trip_photos").delete().in("id", selectedIds);
      if (error) {
        elements.photoStatus.textContent = "No se pudieron borrar las fotos.";
        return;
      }

      const { data: remainingRows, error: verifyError } = await supabase.from("trip_photos").select("id").in("id", selectedIds);
      if (verifyError) {
        elements.photoStatus.textContent = "No se pudo comprobar si las fotos se borraron.";
        return;
      }

      if ((remainingRows || []).length > 0) {
        elements.photoStatus.textContent = "Algunas fotos siguen en el diario. Prueba otra vez.";
        await loadCloudData();
        renderPhotos(new Date());
        return;
      }

      let storageWarning = false;
      if (photoPaths.length > 0) {
        const { error: storageError } = await supabase.storage.from(photoBucket).remove(photoPaths);
        if (storageError) {
          storageWarning = true;
        }
      }

      const deletedCount = selectedItems.length;
      selectedPhotoIds.clear();
      photoEditMode = false;
      await loadCloudData();
      elements.photoStatus.textContent = storageWarning
        ? "Las fotos se quitaron del diario, pero alguna imagen no se pudo borrar del almacenamiento."
        : deletedCount === 1
          ? "1 foto borrada."
          : `${deletedCount} fotos borradas.`;
      renderPhotos(new Date());
    });

    async function handlePhotoGridClick(event) {
      const button = event.target.closest("button[data-action='toggle-photo-selection']");
      if (!button) return;

      const dayKey = button.dataset.day;
      const photoId = button.dataset.id;
      const current = (state.photosByDay[dayKey] || []).find((item) => item.id === photoId);
      if (!current || !photoEditMode) return;

      if (selectedPhotoIds.has(photoId)) {
        selectedPhotoIds.delete(photoId);
      } else {
        selectedPhotoIds.add(photoId);
      }

      elements.photoStatus.textContent = selectedPhotoIds.size > 0 ? `${selectedPhotoIds.size} fotos seleccionadas.` : "Selecciona las fotos que quieras borrar.";
      renderPhotos(new Date());
    }

    elements.photoList.addEventListener("click", handlePhotoGridClick);
    elements.photoTodayGrid.addEventListener("click", handlePhotoGridClick);

    async function init() {
      updateCountdown();
      setInterval(updateCountdown, 1000);
      try {
        await loadCloudData();
        updateCountdown();
      } catch (error) {
        console.error(error);
        elements.plannerStatus.textContent = "No se pudo conectar con Supabase.";
        elements.phraseStatus.textContent = "No se pudo conectar con Supabase.";
        elements.photoStatus.textContent = "No se pudo conectar con Supabase.";
      }
    }

    init();
  </script>
</body>
</html>
